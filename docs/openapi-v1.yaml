openapi: 3.1.0
info:
  title: Cheesy Arena API
  version: 1.0.0-draft
  description: >-
    Versioned API introduced alongside the existing server-rendered interface.
    This document is expanded as each migration phase is implemented.
servers:
  - url: /api/v1
paths:
  /alliances:
    get:
      operationId: listAlliances
      summary: List playoff alliances
      responses:
        "200":
          description: Alliances ordered by ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllianceListResponse"
  /bracket:
    get:
      operationId: getBracket
      summary: Get the playoff bracket as structured data
      parameters:
        - in: query
          name: activeMatch
          schema:
            type: string
            enum: [current, saved]
      responses:
        "200":
          description: Playoff bracket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BracketResponse"
  /event:
    get:
      operationId: getPublicEvent
      summary: Get public event configuration
      responses:
        "200":
          description: Public event configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /session:
    get:
      operationId: getSession
      summary: Get the current session state and CSRF token
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /game/rules:
    get:
      operationId: listGameRules
      summary: List foul rules ordered by ID
      responses:
        "200":
          description: Game rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponse"
  /match-logs:
    get:
      operationId: listMatchLogs
      summary: List matches available to the match log interface
      responses:
        "200":
          description: Matches grouped by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLogListResponse"
  /matches/{type}:
    get:
      operationId: listMatches
      summary: List matches and their latest results
      parameters:
        - in: path
          name: type
          required: true
          schema:
            $ref: "#/components/schemas/MatchType"
      responses:
        "200":
          description: Matches ordered by type order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "400":
          description: Invalid match type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /matches/{matchId}/stations/{stationId}/logs:
    get:
      operationId: getMatchStationLogs
      summary: Get bounded and optionally sampled driver station log rows
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
        - in: path
          name: stationId
          required: true
          schema:
            type: string
            enum: [R1, R2, R3, B1, B2, B3]
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
        - in: query
          name: sampleEvery
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
      responses:
        "200":
          description: Match log details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLogDetailResponse"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Match or station log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rankings:
    get:
      operationId: listRankings
      summary: List qualification rankings
      responses:
        "200":
          description: Rankings and highest played match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingsResponse"
  /sponsor-slides:
    get:
      operationId: listSponsorSlides
      summary: List public sponsor slides
      responses:
        "200":
          description: Sponsor slides in display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorSlideListResponse"
  /teams:
    get:
      operationId: listPublicTeams
      summary: List teams without private network or FTA fields
      responses:
        "200":
          description: Public teams ordered by team number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
  /teams/{teamId}/avatar:
    get:
      operationId: getTeamAvatar
      summary: Get a team avatar or the default avatar
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Avatar image
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
  /admin/awards:
    get:
      operationId: listAdminAwards
      summary: List awards for administration
      security: [{sessionCookie: []}]
      responses:
        "200": {$ref: "#/components/responses/AdminAwardList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createAdminAward
      summary: Create a judged award
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminAwardInput"}
      responses:
        "201": {$ref: "#/components/responses/AdminAwardItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/awards/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminAward
      summary: Update a judged award
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminAwardInput"}
      responses:
        "200": {$ref: "#/components/responses/AdminAwardItem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteAdminAward
      summary: Delete a judged award
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Award deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/scheduled-breaks:
    get:
      operationId: listAdminScheduledBreaks
      summary: List scheduled breaks for administration
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Scheduled breaks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminScheduledBreakListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/scheduled-breaks/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminScheduledBreak
      summary: Update the description of a scheduled break
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminScheduledBreakInput"}
      responses:
        "200":
          description: Updated scheduled break
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminScheduledBreakResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/sponsor-slides:
    get:
      operationId: listAdminSponsorSlides
      summary: List sponsor slides for administration
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Sponsor slides
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideListResponse"}
    post:
      operationId: createAdminSponsorSlide
      summary: Create a sponsor slide
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminSponsorSlideInput"}
      responses:
        "201":
          description: Created sponsor slide
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/sponsor-slides/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminSponsorSlide
      summary: Update a sponsor slide
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminSponsorSlideInput"}
      responses:
        "200":
          description: Updated sponsor slide
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteAdminSponsorSlide
      summary: Delete a sponsor slide
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Sponsor slide deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/sponsor-slides/reorder:
    post:
      operationId: reorderAdminSponsorSlides
      summary: Replace the display order of all sponsor slides
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminReorderInput"}
      responses:
        "200":
          description: Reordered sponsor slides
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideListResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/lower-thirds:
    get:
      operationId: listAdminLowerThirds
      summary: List lower thirds for administration
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Lower thirds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminLowerThirdListResponse"}
    post:
      operationId: createAdminLowerThird
      summary: Create a lower third
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminLowerThirdInput"}
      responses:
        "201": {$ref: "#/components/responses/AdminLowerThirdItem"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/lower-thirds/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminLowerThird
      summary: Update a lower third
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminLowerThirdInput"}
      responses:
        "200": {$ref: "#/components/responses/AdminLowerThirdItem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteAdminLowerThird
      summary: Delete a lower third
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Lower third deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/lower-thirds/reorder:
    post:
      operationId: reorderAdminLowerThirds
      summary: Replace the display order of all lower thirds
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminReorderInput"}
      responses:
        "200":
          description: Reordered lower thirds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminLowerThirdListResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/teams:
    get:
      operationId: listAdminTeams
      summary: List complete administrative team records with secrets masked
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Teams and team-list state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminTeamListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: importAdminTeams
      summary: Start a bulk team import job
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminTeamImportInput"}
      responses:
        "202": {$ref: "#/components/responses/AdminJobItem"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/teams/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    get:
      operationId: getAdminTeam
      summary: Get an administrative team record with its WPA key masked
      security: [{sessionCookie: []}]
      responses:
        "200": {$ref: "#/components/responses/AdminTeamItem"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateAdminTeam
      summary: Update team metadata with explicit WPA key secret semantics
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminTeamUpdateInput"}
      responses:
        "200": {$ref: "#/components/responses/AdminTeamItem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteAdminTeam
      summary: Delete a team before qualification matches exist
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Team deleted}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /admin/teams/refresh:
    post:
      operationId: refreshAdminTeams
      summary: Start a job to refresh every team from The Blue Alliance
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "202": {$ref: "#/components/responses/AdminJobItem"}
  /admin/teams/wpa-keys:
    post:
      operationId: generateAdminTeamWpaKeys
      summary: Generate missing or replacement WPA keys without returning them
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminTeamWpaKeysInput"}
      responses:
        "200":
          description: Number of teams updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminTeamWpaKeysResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAdminJob
      summary: Get background job progress and outcome
      security: [{sessionCookie: []}]
      responses:
        "200": {$ref: "#/components/responses/AdminJobItem"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/judging-schedule:
    get:
      operationId: getAdminJudgingSchedule
      summary: Get judging generation parameters and slots ordered by judge and time
      security: [{sessionCookie: []}]
      responses:
        "200": {$ref: "#/components/responses/AdminJudgingScheduleItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: generateAdminJudgingSchedule
      summary: Generate and atomically retain a judging schedule
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JudgingScheduleParams"}
      responses:
        "201": {$ref: "#/components/responses/AdminJudgingScheduleItem"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: clearAdminJudgingSchedule
      summary: Clear all judging slots
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Judging schedule cleared}
  /admin/settings/{section}:
    parameters:
      - in: path
        name: section
        required: true
        schema: {type: string, enum: [event, integrations, network, hardware, game]}
    get:
      operationId: getAdminSettingsSection
      summary: Get one settings section with secrets represented only as configured flags
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Settings section
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/EventSettingsResponse"}
                  - {$ref: "#/components/schemas/IntegrationSettingsResponse"}
                  - {$ref: "#/components/schemas/NetworkSettingsResponse"}
                  - {$ref: "#/components/schemas/HardwareSettingsResponse"}
                  - {$ref: "#/components/schemas/GameSettingsResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateAdminSettingsSection
      summary: Partially update one settings section
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: "#/components/schemas/EventSettingsInput"}
                - {$ref: "#/components/schemas/IntegrationSettingsInput"}
                - {$ref: "#/components/schemas/NetworkSettingsInput"}
                - {$ref: "#/components/schemas/HardwareSettingsInput"}
                - {$ref: "#/components/schemas/GameSettingsInput"}
      responses:
        "200":
          description: Updated settings section
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/EventSettingsResponse"}
                  - {$ref: "#/components/schemas/IntegrationSettingsResponse"}
                  - {$ref: "#/components/schemas/NetworkSettingsResponse"}
                  - {$ref: "#/components/schemas/HardwareSettingsResponse"}
                  - {$ref: "#/components/schemas/GameSettingsResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/database/backups:
    post:
      operationId: createAdminDatabaseBackup
      summary: Create a server-side snapshot of the event database
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: Backup created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatabaseBackupResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
  /admin/database/restore:
    post:
      operationId: restoreAdminDatabase
      summary: Validate and atomically restore a Cheesy Arena database backup
      description: Existing sessions are invalidated after a successful restore. Uploads are limited to 256 MiB.
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [eventId, confirmation, databaseFile]
              properties:
                eventId:
                  type: integer
                  description: ID of the currently loaded event, not the uploaded event.
                confirmation: {type: string, const: restore}
                databaseFile: {type: string, format: binary}
      responses:
        "200":
          description: Database restored, or the original result when replayed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatabaseRestoreResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413":
          description: Upload exceeds 256 MiB
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/tournament-data/{type}:
    parameters:
      - in: path
        name: type
        required: true
        schema: {type: string, enum: [practice, qualification, playoff]}
    delete:
      operationId: clearAdminTournamentData
      summary: Atomically clear one tournament stage after creating a backup
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TournamentDataClearInput"}
      responses:
        "200":
          description: Cleared record counts, or the result of the original request when replayed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TournamentDataClearResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/publishing/{resource}:
    parameters:
      - in: path
        name: resource
        required: true
        schema: {type: string, enum: [teams, matches, rankings, alliances, awards]}
    post:
      operationId: publishAdminResource
      summary: Start an idempotent background TBA publishing job
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "202":
          description: Publishing job accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublishingResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/match-play/matches:
    get:
      operationId: listAdminMatchPlayMatches
      summary: Get the match selector data formerly rendered as an HTML fragment
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Match selector groups and active tab
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatchPlayMatchesResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/referee/fouls:
    get:
      operationId: getAdminRefereeFouls
      summary: Get the current foul editor rows and rule choices
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Current red and blue foul rows plus the ordered rule catalog
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RefereeFoulsResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/referee/commands:
    post:
      operationId: executeRefereeCommand
      summary: Add or edit fouls and cards
      description: Admin session, CSRF token and Idempotency-Key are required. Allowed commands are addFoul, toggleFoulType, updateFoulTeam, updateFoulRule, deleteFoul and card. Mutations are rejected during timeout or after the alliance fouls are committed. A repeated key with the same command and payload replays the original result without repeating the mutation.
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command, payload]
              properties:
                command: {type: string, enum: [addFoul, toggleFoulType, updateFoulTeam, updateFoulRule, deleteFoul, card]}
                payload:
                  type: object
                  description: Alliance is red or blue; other fields are isMajor, index, teamId, ruleId or card according to command.
      responses:
        "200": {description: Command accepted or safely replayed}
        "400": {description: Malformed or unknown command}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Idempotency key reused or fouls committed}
        "422": {description: Invalid command value or match state}
  /admin/alliance-selection/bootstrap:
    get:
      operationId: getAllianceSelectionControlBootstrap
      summary: Get the alliance selection control read-model and stream URL
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Alliance selection timer, rankings, and audience display mode snapshot}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/alliance-selection/commands:
    post:
      operationId: executeAllianceSelectionCommand
      summary: Control the alliance selection timer or audience display
      description: Admin session, CSRF token and Idempotency-Key are required. A repeated key with the same command and value returns replayed=true without repeating side effects. Timer commands are setTimer (0–3600 seconds), startTimer, stopTimer, restartTimer and hideTimer. Display command is setAudienceDisplay.
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command: {type: string, enum: [setTimer, startTimer, stopTimer, restartTimer, hideTimer, setAudienceDisplay]}
                value: {oneOf: [{type: integer, minimum: 0, maximum: 3600}, {type: string}]}
      responses:
        "200": {description: Command accepted or safely replayed}
        "400": {description: Malformed command or missing idempotency key}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Idempotency key reused for a different command}
        "422": {description: Invalid command value}
  /admin/match-play/bootstrap:
    get:
      operationId: getMatchPlayControlBootstrap
      summary: Get the complete match play control read-model and stream URL
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Match, arena readiness, score, display mode, and scoring commit snapshot}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/match-play/commands:
    post:
      operationId: executeMatchPlayControlCommand
      summary: Execute a non-scoring match play field-control command
      description: Admin session, CSRF token and Idempotency-Key are required. Currently supports setAudienceDisplay, setAllianceStationDisplay, toggleBypass, signalVolunteers, signalReset, startTimeout, setTimeoutDisplay and setTestMatchName. Repeating the same key and command/value returns replayed=true without reapplying the mutation. Match start, abort, result post and match advancement are not yet exposed.
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command: {type: string, enum: [setAudienceDisplay, setAllianceStationDisplay, toggleBypass, signalVolunteers, signalReset, startTimeout, setTimeoutDisplay, setTestMatchName]}
                value: {}
      responses:
        "200": {description: Command accepted or safely replayed}
        "400": {description: Malformed or unknown command}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Idempotency key reused or command disallowed in current state}
        "422": {description: Invalid command value}
        "503": {description: Field command failed without leaking internal details}
  /admin/scoring/{position}/bootstrap:
    get:
      operationId: getScoringPanelBootstrap
      summary: Get a scoring panel read-model and stream URL
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: position, required: true, schema: {type: string, enum: [red, blue]}}
      responses:
        "200": {description: Current match, clock, and editable scoring state}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/scoring/{position}/commands:
    post:
      operationId: executeScoringTowerCommand
      summary: Set automatic or endgame tower status for a scoring position
      description: Admin session, CSRF token and Idempotency-Key are required. Currently supports autoTower and endgame only; addFoul uses the Referee command API and panel commit remains on the legacy socket. Values are teamPosition 1–3 and tower status 0–3. Repeating the same key/command/payload replays the original result without mutating the score again.
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: position, required: true, schema: {type: string, enum: [red, blue]}}
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command, payload]
              properties:
                command: {type: string, enum: [autoTower, endgame]}
                payload: {type: object}
      responses:
        "200": {description: Command accepted or safely replayed}
        "400": {description: Malformed or unknown command}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Scoring position not found}
        "409": {description: Idempotency key reused or panel already committed}
        "422": {description: Invalid tower value or match state}
  /admin/referee/bootstrap:
    get:
      operationId: getRefereePanelBootstrap
      summary: Get the referee panel read-model and stream URL
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Current match, clock, fouls/cards, station bypass, and scoring readiness}
  /admin/field-testing/bootstrap:
    get:
      operationId: getFieldTestingBootstrap
      summary: Get PLC I/O, match safety state, LED state, and the field-testing stream URL
      security: [{sessionCookie: []}]
      responses:
        "200": {description: Field-testing read-model snapshot}
  /admin/field-testing/commands:
    post:
      operationId: executeFieldTestingCommand
      summary: Play a test sound or control PLC coil override and LED mode
      description: Admin session, CSRF token and Idempotency-Key are required. Commands are playSound, setPlcCoilOverride and setLedMode. Coil and LED overrides are forbidden during a live match. Repeating the same key/command/value replays the original result without repeating the hardware operation.
      security: [{sessionCookie: []}]
      parameters:
        - {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command: {type: string, enum: [playSound, setPlcCoilOverride, setLedMode]}
                value: {}
      responses:
        "200": {description: Command accepted or safely replayed}
        "400": {description: Malformed or unknown command}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Idempotency key reused or override disallowed during a match}
        "422": {description: Invalid sound, coil, override or LED mode}
  /displays/queueing/matches:
    get:
      operationId: listQueueingDisplayMatches
      summary: Get the upcoming match cards for the queueing display
      responses:
        "200":
          description: Queueing display match cards in display order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueueingDisplayMatchesResponse"}
  /displays/announcer/match:
    get:
      operationId: getAnnouncerDisplayMatch
      summary: Get teams and rankings for the announcer display's current match
      responses:
        "200":
          description: Current match announcer data
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncerDisplayMatchResponse"}
  /displays/announcer/score:
    get:
      operationId: getAnnouncerDisplayScore
      summary: Get the most recently posted score for the announcer display
      responses:
        "200":
          description: Posted score details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncerDisplayScoreResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
  /displays/queueing/bootstrap:
    get:
      operationId: getQueueingDisplayBootstrap
      summary: Get the recovery snapshot and v1 stream URL for the queueing display
      responses:
        "200":
          description: Immutable queueing display snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueueingDisplayBootstrapResponse"}
  /displays/announcer/bootstrap:
    get:
      operationId: getAnnouncerDisplayBootstrap
      summary: Get the recovery snapshot and v1 stream URL for the announcer display
      responses:
        "200":
          description: Immutable announcer display snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncerDisplayBootstrapResponse"}
  /displays/audience/bootstrap:
    get:
      operationId: getAudienceDisplayBootstrap
      summary: Get the recovery snapshot and v1 stream URL for the audience display
      responses:
        "200":
          description: Immutable audience display snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AudienceDisplayBootstrapResponse"}
  /displays/alliance-station/bootstrap:
    get:
      operationId: getAllianceStationDisplayBootstrap
      summary: Get the recovery snapshot and v1 stream URL for an alliance station display
      responses:
        "200":
          description: Immutable alliance station display snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllianceStationDisplayBootstrapResponse"}
  /displays/wall/bootstrap:
    get:
      operationId: getWallDisplayBootstrap
      summary: Get the recovery snapshot and v1 stream URL for the wall display
      responses:
        "200": {description: Immutable wall display snapshot}
  /displays/unpicked/bootstrap:
    get:
      operationId: getUnpickedDisplayBootstrap
      summary: Get the recovery snapshot and v1 stream URL for the unpicked teams display
      responses:
        "200": {description: Immutable unpicked teams display snapshot}
  /displays/field-monitor/bootstrap:
    get:
      operationId: getFieldMonitorDisplayBootstrap
      summary: Get the recovery snapshot and v1 stream URL for a field monitor
      description: FTA notes are included only when fta=true and the caller is an administrator.
      parameters:
        - {in: query, name: fta, schema: {type: boolean}}
      responses:
        "200": {description: Immutable field monitor snapshot}
  /streams/displays/queueing:
    get:
      operationId: streamQueueingDisplay
      summary: Upgrade to the sequenced queueing display WebSocket v1 stream
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/displays/announcer:
    get:
      operationId: streamAnnouncerDisplay
      summary: Upgrade to the sequenced announcer display WebSocket v1 stream
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/displays/audience:
    get:
      operationId: streamAudienceDisplay
      summary: Upgrade to the sequenced audience display WebSocket v1 stream
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/displays/alliance-station:
    get:
      operationId: streamAllianceStationDisplay
      summary: Upgrade to the sequenced alliance station display WebSocket v1 stream
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/displays/wall:
    get:
      operationId: streamWallDisplay
      summary: Upgrade to the sequenced wall display WebSocket v1 stream
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/displays/unpicked:
    get:
      operationId: streamUnpickedDisplay
      summary: Upgrade to the sequenced unpicked teams WebSocket v1 stream
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/displays/field-monitor:
    get:
      operationId: streamFieldMonitorDisplay
      summary: Upgrade to the sequenced field monitor WebSocket v1 stream
      description: FTA notes require fta=true and an administrator session.
      x-websocket: true
      parameters:
        - {in: query, name: fta, schema: {type: boolean}}
        - {in: query, name: fms, schema: {type: boolean}}
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/admin/alliance-selection:
    get:
      operationId: streamAllianceSelectionControl
      summary: Upgrade to the sequenced alliance selection control stream
      description: Client may send type=command with data containing requestId, idempotencyKey, csrfToken, command and optional value. Server replies with type=commandResult, the same requestId, replayed flag and optional error code; command responses have sequence 0 and do not affect read-model event sequences. The CSRF token must match the csrf_token cookie. Commands and validation match POST /admin/alliance-selection/commands.
      security: [{sessionCookie: []}]
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/admin/match-play:
    get:
      operationId: streamMatchPlayControl
      summary: Upgrade to the sequenced match play control stream
      description: Client may send type=command with data containing requestId, idempotencyKey, csrfToken, command and optional value. Server replies with type=commandResult, the same requestId, replayed flag and optional error code. Command responses have sequence 0 and do not affect read-model event sequences. The CSRF token must match the csrf_token cookie. Supported commands match POST /admin/match-play/commands; match start, abort and post are not yet exposed.
      security: [{sessionCookie: []}]
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/admin/scoring/{position}:
    get:
      operationId: streamScoringPanel
      summary: Upgrade to a sequenced scoring panel stream
      description: Client may send type=command with data containing requestId, idempotencyKey, csrfToken, command and payload. Server replies with type=commandResult, the same requestId, changed/replayed fields and optional error code. Command responses have sequence 0 and do not affect read-model event sequences. The CSRF token must match the csrf_token cookie. Supported tower commands match POST /admin/scoring/{position}/commands; panel commit is not yet exposed.
      security: [{sessionCookie: []}]
      x-websocket: true
      parameters:
        - {in: path, name: position, required: true, schema: {type: string, enum: [red, blue]}}
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/admin/referee:
    get:
      operationId: streamRefereePanel
      summary: Upgrade to the sequenced referee panel stream
      description: Client may send type=command with data containing requestId, idempotencyKey, csrfToken, command and payload. Server replies with type=commandResult, the same requestId, changed/foulId/replayed fields and optional error code. Command responses have sequence 0 and do not affect read-model event sequences. The CSRF token must match the csrf_token cookie. Commands and validation match POST /admin/referee/commands.
      security: [{sessionCookie: []}]
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
  /streams/admin/field-testing:
    get:
      operationId: streamFieldTesting
      summary: Upgrade to the sequenced PLC, match-state, and LED stream
      description: Client may send type=command with data containing requestId, idempotencyKey, csrfToken, command and optional value. Server replies with type=commandResult, the same requestId, replayed flag and optional error code. Command responses have sequence 0 and do not affect read-model event sequences. The CSRF token must match the csrf_token cookie. Supported commands match POST /admin/field-testing/commands.
      security: [{sessionCookie: []}]
      x-websocket: true
      responses:
        "101": {description: WebSocket protocol switched; messages use the v1 stream envelope.}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema: {type: integer, minimum: 1}
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: Administrator permission or a valid CSRF token is required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ValidationError:
      description: Request failed business validation
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Conflict:
      description: Resource state conflicts with the operation
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    AdminTeamItem:
      description: Administrative team record
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminTeamResponse"}
    AdminJobItem:
      description: Background job
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminJobResponse"}
    AdminJudgingScheduleItem:
      description: Judging schedule snapshot
      content:
        application/json:
          schema: {$ref: "#/components/schemas/JudgingScheduleResponse"}
    AdminAwardList:
      description: Awards
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminAwardListResponse"}
    AdminAwardItem:
      description: Award
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminAwardResponse"}
    AdminLowerThirdItem:
      description: Lower third
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminLowerThirdResponse"}
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AdminTeam:
      type: object
      required: [id, name, nickname, city, stateProv, country, schoolName, rookieYear, robotName, accomplishments, wpaKeyConfigured, yellowCard, hasConnected, ftaNotes]
      properties:
        id: {type: integer}
        name: {type: string}
        nickname: {type: string}
        city: {type: string}
        stateProv: {type: string}
        country: {type: string}
        schoolName: {type: string}
        rookieYear: {type: integer, minimum: 0}
        robotName: {type: string}
        accomplishments: {type: string}
        wpaKeyConfigured:
          type: boolean
          description: Whether a WPA key is stored; the key itself is never returned.
        yellowCard: {type: boolean}
        hasConnected: {type: boolean}
        ftaNotes: {type: string}
    AdminTeamResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/AdminTeam"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminTeamListData:
      type: object
      required: [teams, canModifyTeamList, networkSecurityEnabled]
      properties:
        teams: {type: array, items: {$ref: "#/components/schemas/AdminTeam"}}
        canModifyTeamList: {type: boolean}
        networkSecurityEnabled: {type: boolean}
    AdminTeamListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/AdminTeamListData"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminTeamImportInput:
      type: object
      additionalProperties: false
      required: [teamIds, downloadOfficialData]
      properties:
        teamIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: integer, minimum: 1}
        downloadOfficialData: {type: boolean}
    SecretInput:
      type: object
      additionalProperties: false
      required: [action, value]
      properties:
        action: {type: string, enum: [keep, replace, clear]}
        value:
          type: string
          description: Required only when action is replace; ignored otherwise.
    AdminTeamUpdateInput:
      type: object
      additionalProperties: false
      required: [name, nickname, city, stateProv, country, schoolName, rookieYear, robotName, accomplishments, hasConnected, ftaNotes]
      properties:
        name: {type: string}
        nickname: {type: string}
        city: {type: string}
        stateProv: {type: string}
        country: {type: string}
        schoolName: {type: string}
        rookieYear: {type: integer, minimum: 0}
        robotName: {type: string}
        accomplishments: {type: string}
        wpaKey: {$ref: "#/components/schemas/SecretInput"}
        hasConnected: {type: boolean}
        ftaNotes: {type: string}
    AdminTeamWpaKeysInput:
      type: object
      additionalProperties: false
      required: [replaceAll]
      properties:
        replaceAll: {type: boolean}
    AdminTeamWpaKeysResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [updated]
          properties:
            updated: {type: integer, minimum: 0}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminJob:
      type: object
      required: [id, type, status, progress, error, createdAt, startedAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [team_import, team_refresh, publish_teams, publish_matches, publish_rankings, publish_alliances, publish_awards]}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        progress: {type: integer, minimum: 0, maximum: 100}
        error: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, "null"], format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AdminJobResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/AdminJob"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    JudgingScheduleParams:
      type: object
      additionalProperties: false
      required: [numJudges, durationMinutes, previousSpacingMinutes, nextSpacingMinutes]
      properties:
        numJudges: {type: integer, minimum: 1, maximum: 100}
        durationMinutes: {type: integer, minimum: 1, maximum: 1440}
        previousSpacingMinutes: {type: integer, minimum: 1, maximum: 1440}
        nextSpacingMinutes: {type: integer, minimum: 1, maximum: 1440}
    JudgingSlot:
      type: object
      required: [id, time, teamId, previousMatchNumber, previousMatchTime, nextMatchNumber, nextMatchTime, judgeNumber]
      properties:
        id: {type: integer}
        time: {type: string, format: date-time}
        teamId: {type: integer}
        previousMatchNumber: {type: integer, minimum: 0}
        previousMatchTime:
          type: string
          description: RFC 3339, or an empty string when no previous match exists.
        nextMatchNumber: {type: integer, minimum: 0}
        nextMatchTime:
          type: string
          description: RFC 3339, or an empty string when no next match exists.
        judgeNumber: {type: integer, minimum: 1}
    JudgingSchedule:
      type: object
      required: [params, slots]
      properties:
        params: {$ref: "#/components/schemas/JudgingScheduleParams"}
        slots: {type: array, items: {$ref: "#/components/schemas/JudgingSlot"}}
    JudgingScheduleResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/JudgingSchedule"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    EventSettings:
      type: object
      required: [name, playoffType, numPlayoffAlliances, selectionRound2Order, selectionRound3Order, selectionShowUnpickedTeams, autoAudienceDisplayEnabled, adminPasswordConfigured]
      properties:
        name: {type: string}
        playoffType: {type: string, enum: [double_elimination, single_elimination]}
        numPlayoffAlliances: {type: integer, minimum: 2, maximum: 16}
        selectionRound2Order: {type: string}
        selectionRound3Order: {type: string}
        selectionShowUnpickedTeams: {type: boolean}
        autoAudienceDisplayEnabled: {type: boolean}
        adminPasswordConfigured: {type: boolean}
    EventSettingsInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        playoffType: {type: string, enum: [double_elimination, single_elimination]}
        numPlayoffAlliances: {type: integer, minimum: 2, maximum: 16}
        selectionRound2Order: {type: string}
        selectionRound3Order: {type: string}
        selectionShowUnpickedTeams: {type: boolean}
        autoAudienceDisplayEnabled: {type: boolean}
        adminPassword: {$ref: "#/components/schemas/SecretInput"}
    EventSettingsResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/EventSettings"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    IntegrationSettings:
      type: object
      required: [tbaDownloadEnabled, tbaPublishingEnabled, tbaEventCode, tbaSecretIdConfigured, tbaSecretConfigured, nexusEnabled, nexusAutoQueueEnabled, nexusAutoQueueKeyConfigured]
      properties:
        tbaDownloadEnabled: {type: boolean}
        tbaPublishingEnabled: {type: boolean}
        tbaEventCode: {type: string}
        tbaSecretIdConfigured: {type: boolean}
        tbaSecretConfigured: {type: boolean}
        nexusEnabled: {type: boolean}
        nexusAutoQueueEnabled: {type: boolean}
        nexusAutoQueueKeyConfigured: {type: boolean}
    IntegrationSettingsInput:
      type: object
      additionalProperties: false
      properties:
        tbaDownloadEnabled: {type: boolean}
        tbaPublishingEnabled: {type: boolean}
        tbaEventCode: {type: string}
        tbaSecretId: {$ref: "#/components/schemas/SecretInput"}
        tbaSecret: {$ref: "#/components/schemas/SecretInput"}
        nexusEnabled: {type: boolean}
        nexusAutoQueueEnabled: {type: boolean}
        nexusAutoQueueKey: {$ref: "#/components/schemas/SecretInput"}
    IntegrationSettingsResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/IntegrationSettings"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
