openapi: 3.1.0
info:
  title: Cheesy Arena API
  version: 1.0.0-draft
  description: >-
    Versioned API introduced alongside the existing server-rendered interface.
    This document is expanded as each migration phase is implemented.
servers:
  - url: /api/v1
paths:
  /alliances:
    get:
      operationId: listAlliances
      summary: List playoff alliances
      responses:
        "200":
          description: Alliances ordered by ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllianceListResponse"
  /bracket:
    get:
      operationId: getBracket
      summary: Get the playoff bracket as structured data
      parameters:
        - in: query
          name: activeMatch
          schema:
            type: string
            enum: [current, saved]
      responses:
        "200":
          description: Playoff bracket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BracketResponse"
  /event:
    get:
      operationId: getPublicEvent
      summary: Get public event configuration
      responses:
        "200":
          description: Public event configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /session:
    get:
      operationId: getSession
      summary: Get the current session state and CSRF token
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /game/rules:
    get:
      operationId: listGameRules
      summary: List foul rules ordered by ID
      responses:
        "200":
          description: Game rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponse"
  /match-logs:
    get:
      operationId: listMatchLogs
      summary: List matches available to the match log interface
      responses:
        "200":
          description: Matches grouped by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLogListResponse"
  /matches/{type}:
    get:
      operationId: listMatches
      summary: List matches and their latest results
      parameters:
        - in: path
          name: type
          required: true
          schema:
            $ref: "#/components/schemas/MatchType"
      responses:
        "200":
          description: Matches ordered by type order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "400":
          description: Invalid match type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /matches/{matchId}/stations/{stationId}/logs:
    get:
      operationId: getMatchStationLogs
      summary: Get bounded and optionally sampled driver station log rows
      parameters:
        - in: path
          name: matchId
          required: true
          schema:
            type: integer
        - in: path
          name: stationId
          required: true
          schema:
            type: string
            enum: [R1, R2, R3, B1, B2, B3]
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
        - in: query
          name: sampleEvery
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
      responses:
        "200":
          description: Match log details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLogDetailResponse"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Match or station log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rankings:
    get:
      operationId: listRankings
      summary: List qualification rankings
      responses:
        "200":
          description: Rankings and highest played match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingsResponse"
  /sponsor-slides:
    get:
      operationId: listSponsorSlides
      summary: List public sponsor slides
      responses:
        "200":
          description: Sponsor slides in display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorSlideListResponse"
  /teams:
    get:
      operationId: listPublicTeams
      summary: List teams without private network or FTA fields
      responses:
        "200":
          description: Public teams ordered by team number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
  /teams/{teamId}/avatar:
    get:
      operationId: getTeamAvatar
      summary: Get a team avatar or the default avatar
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Avatar image
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
  /admin/awards:
    get:
      operationId: listAdminAwards
      summary: List awards for administration
      security: [{sessionCookie: []}]
      responses:
        "200": {$ref: "#/components/responses/AdminAwardList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createAdminAward
      summary: Create a judged award
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminAwardInput"}
      responses:
        "201": {$ref: "#/components/responses/AdminAwardItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/awards/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminAward
      summary: Update a judged award
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminAwardInput"}
      responses:
        "200": {$ref: "#/components/responses/AdminAwardItem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteAdminAward
      summary: Delete a judged award
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Award deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/scheduled-breaks:
    get:
      operationId: listAdminScheduledBreaks
      summary: List scheduled breaks for administration
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Scheduled breaks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminScheduledBreakListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/scheduled-breaks/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminScheduledBreak
      summary: Update the description of a scheduled break
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminScheduledBreakInput"}
      responses:
        "200":
          description: Updated scheduled break
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminScheduledBreakResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/sponsor-slides:
    get:
      operationId: listAdminSponsorSlides
      summary: List sponsor slides for administration
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Sponsor slides
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideListResponse"}
    post:
      operationId: createAdminSponsorSlide
      summary: Create a sponsor slide
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminSponsorSlideInput"}
      responses:
        "201":
          description: Created sponsor slide
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/sponsor-slides/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminSponsorSlide
      summary: Update a sponsor slide
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminSponsorSlideInput"}
      responses:
        "200":
          description: Updated sponsor slide
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteAdminSponsorSlide
      summary: Delete a sponsor slide
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Sponsor slide deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/sponsor-slides/reorder:
    post:
      operationId: reorderAdminSponsorSlides
      summary: Replace the display order of all sponsor slides
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminReorderInput"}
      responses:
        "200":
          description: Reordered sponsor slides
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SponsorSlideListResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/lower-thirds:
    get:
      operationId: listAdminLowerThirds
      summary: List lower thirds for administration
      security: [{sessionCookie: []}]
      responses:
        "200":
          description: Lower thirds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminLowerThirdListResponse"}
    post:
      operationId: createAdminLowerThird
      summary: Create a lower third
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminLowerThirdInput"}
      responses:
        "201": {$ref: "#/components/responses/AdminLowerThirdItem"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /admin/lower-thirds/{id}:
    parameters: [{$ref: "#/components/parameters/ResourceId"}]
    patch:
      operationId: updateAdminLowerThird
      summary: Update a lower third
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminLowerThirdInput"}
      responses:
        "200": {$ref: "#/components/responses/AdminLowerThirdItem"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      operationId: deleteAdminLowerThird
      summary: Delete a lower third
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: Lower third deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/lower-thirds/reorder:
    post:
      operationId: reorderAdminLowerThirds
      summary: Replace the display order of all lower thirds
      security: [{sessionCookie: []}]
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminReorderInput"}
      responses:
        "200":
          description: Reordered lower thirds
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminLowerThirdListResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema: {type: integer, minimum: 1}
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: Administrator permission or a valid CSRF token is required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ValidationError:
      description: Request failed business validation
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    AdminAwardList:
      description: Awards
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminAwardListResponse"}
    AdminAwardItem:
      description: Award
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminAwardResponse"}
    AdminLowerThirdItem:
      description: Lower third
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AdminLowerThirdResponse"}
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AdminAwardInput:
      type: object
      additionalProperties: false
      required: [awardName, teamId, personName]
      properties:
        awardName: {type: string, minLength: 1}
        teamId: {type: integer}
        personName: {type: string}
    AdminAward:
      allOf:
        - {$ref: "#/components/schemas/AdminAwardInput"}
        - type: object
          required: [id]
          properties:
            id: {type: integer}
    AdminAwardResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/AdminAward"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminAwardListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AdminAward"}}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminScheduledBreakInput:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: {type: string}
    AdminScheduledBreak:
      type: object
      required: [id, matchType, typeOrderBefore, time, durationSec, description]
      properties:
        id: {type: integer}
        matchType: {$ref: "#/components/schemas/MatchType"}
        typeOrderBefore: {type: integer}
        time: {type: string, format: date-time}
        durationSec: {type: integer, minimum: 0}
        description: {type: string}
    AdminScheduledBreakResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/AdminScheduledBreak"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminScheduledBreakListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AdminScheduledBreak"}}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminSponsorSlideInput:
      type: object
      additionalProperties: false
      required: [subtitle, line1, line2, image, displayTimeSec]
      properties:
        subtitle: {type: string}
        line1: {type: string}
        line2: {type: string}
        image: {type: string}
        displayTimeSec: {type: integer, minimum: 1}
    SponsorSlideResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/SponsorSlide"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminLowerThirdInput:
      type: object
      additionalProperties: false
      required: [topText, bottomText]
      properties:
        topText: {type: string, minLength: 1}
        bottomText: {type: string}
    AdminLowerThird:
      allOf:
        - {$ref: "#/components/schemas/AdminLowerThirdInput"}
        - type: object
          required: [id, displayOrder, awardId]
          properties:
            id: {type: integer}
            displayOrder: {type: integer}
            awardId: {type: integer}
    AdminLowerThirdResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/AdminLowerThird"}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminLowerThirdListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AdminLowerThird"}}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    AdminReorderInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: {type: array, items: {type: integer}}
    MatchType:
      type: string
      enum: [test, practice, qualification, playoff]
    MatchStatus:
      type: string
      enum: [scheduled, hidden, red_won, blue_won, tie]
    ResponseMeta:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string
        version:
          type: integer
          minimum: 0
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    MatchTiming:
      type: object
      required:
        - autoDurationSec
        - pauseDurationSec
        - transitionShiftDurationSec
        - shiftDurationSec
        - endgameDurationSec
      properties:
        autoDurationSec:
          type: integer
          minimum: 0
        pauseDurationSec:
          type: integer
          minimum: 0
        transitionShiftDurationSec:
          type: integer
          minimum: 0
        shiftDurationSec:
          type: integer
          minimum: 0
        endgameDurationSec:
          type: integer
          minimum: 0
    PublicEvent:
      type: object
      required:
        - id
        - name
        - playoffType
        - numPlayoffAlliances
        - selectionShowUnpickedTeams
        - networkSecurityEnabled
        - matchTiming
      properties:
        id:
          type: integer
        name:
          type: string
        playoffType:
          type: string
          enum:
            - double_elimination
            - single_elimination
        numPlayoffAlliances:
          type: integer
          minimum: 2
          maximum: 16
        selectionShowUnpickedTeams:
          type: boolean
        networkSecurityEnabled:
          type: boolean
        matchTiming:
          $ref: "#/components/schemas/MatchTiming"
    PublicEventResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/PublicEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Session:
      type: object
      required:
        - authenticated
        - admin
        - csrfToken
      properties:
        authenticated:
          type: boolean
        admin:
          type: boolean
        username:
          type:
            - string
            - "null"
        csrfToken:
          type: string
    SessionResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Session"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    MatchTeam:
      type: object
      required: [teamId, isSurrogate]
      properties:
        teamId:
          type: integer
        isSurrogate:
          type: boolean
    Match:
      type: object
      required: [id, type, typeOrder, time, longName, shortName, nameDetail, playoffMatchGroupId, playoffRedAlliance, playoffBlueAlliance, red, blue, startedAt, scoreCommittedAt, fieldReadyAt, status, useTiebreakCriteria, tbaMatchKey]
      properties:
        id: {type: integer}
        type: {$ref: "#/components/schemas/MatchType"}
        typeOrder: {type: integer}
        time: {type: string, format: date-time}
        longName: {type: string}
        shortName: {type: string}
        nameDetail: {type: string}
        playoffMatchGroupId: {type: string}
        playoffRedAlliance: {type: integer}
        playoffBlueAlliance: {type: integer}
        red:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: "#/components/schemas/MatchTeam"}
        blue:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: "#/components/schemas/MatchTeam"}
        startedAt: {type: [string, "null"], format: date-time}
        scoreCommittedAt: {type: [string, "null"], format: date-time}
        fieldReadyAt: {type: [string, "null"], format: date-time}
        status: {$ref: "#/components/schemas/MatchStatus"}
        useTiebreakCriteria: {type: boolean}
        tbaMatchKey:
          type: object
          required: [compLevel, setNumber, matchNumber]
          properties:
            compLevel: {type: string}
            setNumber: {type: integer}
            matchNumber: {type: integer}
    ScoreSummary:
      type: object
      additionalProperties: false
      required: [score, matchPoints, postMatchPoints, foulPoints, bonusRankingPoints, playoffDq]
      properties:
        autoFuelPoints: {type: integer}
        autoTowerPoints: {type: integer}
        teleopFuelPoints: {type: integer}
        teleopTowerPoints: {type: integer}
        numFuel: {type: integer}
        numFuelPostMatch: {type: integer}
        numFuelGoal: {type: integer}
        matchPoints: {type: integer}
        postMatchPoints: {type: integer}
        foulPoints: {type: integer}
        score: {type: integer}
        playoffDq: {type: boolean}
        energizedBonusRankingPoint: {type: boolean}
        superchargedBonusRankingPoint: {type: boolean}
        traversalBonusRankingPoint: {type: boolean}
        bonusRankingPoints: {type: integer}
        numOpponentMajorFouls: {type: integer}
    MatchResult:
      type: object
      required: [id, playNumber, redSummary, blueSummary, redCards, blueCards]
      properties:
        id: {type: integer}
        playNumber: {type: integer}
        redSummary: {$ref: "#/components/schemas/ScoreSummary"}
        blueSummary: {$ref: "#/components/schemas/ScoreSummary"}
        redCards: {type: object, additionalProperties: {type: string}}
        blueCards: {type: object, additionalProperties: {type: string}}
    MatchWithResult:
      type: object
      required: [match, result]
      properties:
        match: {$ref: "#/components/schemas/Match"}
        result:
          oneOf:
            - {$ref: "#/components/schemas/MatchResult"}
            - {type: "null"}
    MatchListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/MatchWithResult"}}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    Alliance:
      type: object
      required: [id, teamIds, lineup]
      properties:
        id: {type: integer}
        teamIds: {type: array, items: {type: integer}}
        lineup: {type: array, minItems: 3, maxItems: 3, items: {type: integer}}
    AllianceListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Alliance"}}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    Ranking:
      type: object
      required: [teamId, nickname, rank, previousRank, rankingPoints, matchPoints, autoFuelPoints, towerPoints, wins, losses, ties, disqualifications, played]
      properties:
        teamId: {type: integer}
        nickname: {type: string}
        rank: {type: integer}
        previousRank: {type: integer}
        rankingPoints: {type: integer}
        matchPoints: {type: integer}
        autoFuelPoints: {type: integer}
        towerPoints: {type: integer}
        wins: {type: integer}
        losses: {type: integer}
        ties: {type: integer}
        disqualifications: {type: integer}
        played: {type: integer}
    RankingsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [rankings, highestPlayedMatch]
          properties:
            rankings: {type: array, items: {$ref: "#/components/schemas/Ranking"}}
            highestPlayedMatch: {type: string}
